name: CI

# Roda o que hoje só rodava quando alguém lembrava.
# Nada aqui publica: nenhum step tem credencial de deploy, por desenho.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ambiente
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[telemetry,dashboard,dev]'

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Formatação (ruff)
        run: .venv/bin/ruff format --check .

      - name: Tipos (mypy)
        run: .venv/bin/mypy src/
        continue-on-error: true # adoção gradual — ver ADR-012

      - name: Testes + cobertura
        run: .venv/bin/python -m pytest tests/ -q --cov=asus_theye --cov-report=xml

      - name: Guardar cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  politica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o scan de segredos precisa do histórico

      - uses: astral-sh/setup-uv@v7

      - name: Ambiente
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: FRONTEIRA — titularidade e direitos do titular
        # A trava mais importante do repositório, e por isso ela roda em TODO
        # PR, não só no cron. Verifica que cada arquivo versionado declara a
        # titularidade, que a proveniência está registrada, e que nenhum dado de
        # terceiro com termos restritivos voltou. Sai com erro se romper —
        # nenhum PR entra na main afrouxando a autoria do titular.
        run: .venv/bin/python -m asus_theye.cli projeto-fronteira --no-audit

      - name: Validar os workflows (actionlint)
        # Um `secrets` dentro de `if:` de step invalidou operacao-continua.yml e
        # ele falhou 53 vezes em 0s sem ninguém ver. O YAML era VÁLIDO — só
        # actionlint pega erro de expressão. yamllint não pegaria.
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Portão de política
        # broadcast desligado, nenhum .env real, ABI de ancoragem estreita
        run: .venv/bin/python scripts/policy_gate.py

      - name: Cobertura de eventos de auditoria
        run: .venv/bin/python scripts/event_coverage.py

      - name: Nenhum segredo rastreado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.key$|\.pem$|staging-token|publish-lock'; then
            echo "::error::segredo rastreado pelo git"
            exit 1
          fi

      - name: Nenhuma chave privada no histórico
        run: |
          if git log -p --all | grep -qE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo "::error::chave privada no histórico"
            exit 1
          fi

  integridade-dos-dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Ambiente
        run: |
          uv venv
          uv pip install -e '.[telemetry,dashboard,dev]'

      - name: Registros de dados íntegros
        # 145 nichos, 19 categorias, 8 tiers, pesos somando 1.0,
        # crosswalks pendentes vazios, nenhum alias ambíguo
        run: |
          .venv/bin/python -m pytest \
            tests/decision_context tests/source_graph tests/commercial -q

      - name: Painel mede sem erro
        run: .venv/bin/python -m asus_theye.cli chart

  pacote-instalado:
    runs-on: ubuntu-latest
    # Garante que o pacote funciona instalado (não-editável), fora da árvore de
    # código — o defeito original (parents[N] resolvendo para site-packages) era
    # invisível para todos os 876 testes editable.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Instalar pacote (não-editável)
        run: |
          uv venv
          uv pip install '.[dev]'

      - name: Selar evento fora da árvore de código
        # Muda para um diretório sem relação com o repositório, prova que o
        # pacote instalado encontra a migração via importlib.resources.
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/audit/test_installed_package.py" -v -s

      - name: Prova no log — imprime event_hash
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PYEOF'
          import sys
          sys.path.insert(0, "")  # garante que não usa o src local
          from asus_theye.audit.schema import GENESIS_HASH, SCHEMA_VERSION, seal_event
          from asus_theye.audit.sdk import SQLiteAuditStore
          store = SQLiteAuditStore(":memory:")
          raw = {
            "schema_version": SCHEMA_VERSION,
            "event_id": "evt-ci-prova-01",
            "idempotency_key": "idem-ci-prova-01234567",
            "tenant_id": "ci",
            "sequence": 1,
            "event_type": "document.created",
            "action": "create",
            "occurred_at": "2026-08-20T00:00:00Z",
            "recorded_at": "2026-08-20T00:00:01Z",
            "actor_type": "service",
            "actor_id_pseudonymous": "a" * 64,
            "actor_role": "writer",
            "source_system": "ci",
            "resource_type": "document",
            "resource_id_pseudonymous": "b" * 64,
            "resource_version": "1",
            "jurisdiction": "BR",
            "legal_area_ids": [],
            "classification": "restricted",
            "retention_policy_id": "audit-default-v1",
            "lawful_basis_reference": "ci-only",
            "content_hash_sha256": "c" * 64,
            "metadata_hash_sha256": "d" * 64,
            "previous_event_hash_sha256": GENESIS_HASH,
            "correlation_id": "ci-corr-01",
            "causation_id": None,
            "model_provider": None,
            "model_name": None,
            "model_version": None,
            "prompt_template_version": None,
            "source_citation_hashes": [],
            "human_review_status": "not_required",
            "reviewer_pseudonymous": None,
            "result_status": "success",
            "error_code": None,
            "created_by_service": "ci",
            "build_version": "ci",
          }
          sealed = seal_event(raw)
          receipt = store.append(sealed)
          print(f"event_hash={receipt['event_hash_sha256']}")
          assert len(receipt["event_hash_sha256"]) == 64
          PYEOF
