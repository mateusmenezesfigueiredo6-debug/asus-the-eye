name: audit-local
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest
      - run: python scripts/policy_gate.py
      - run: python scripts/event_coverage.py
  security:
    runs-on: ubuntu-latest
    # security-events:write exige GitHub Advanced Security, que este repo privado
    # nao tem (ver nota abaixo). Pedir uma permissao nao-concedivel degradava o
    # grant do token e o gitleaks perdia acesso a /pulls/{n}/commits (403 em PR).
    # Fica so o que e concedivel e necessario: ler conteudo e commits do PR.
    permissions: {contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with: {path: ".", format: "cyclonedx-json", output-file: "sbom.cdx.json"}
  # dependency-review e codeql (setup avancado) exigem GitHub Advanced Security.
  # Em repositorio privado isso e recurso pago por committer ativo — conflita com
  # a regra do projeto de nao criar dependencia paga a terceiro. Desligados aqui;
  # religar exigiria decisao consciente de pagar pelo GHAS ou tornar o repo publico.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/policy_gate.py
      - run: |
          if command -v forge >/dev/null && test -d contracts/audit-anchor/lib/openzeppelin-contracts; then
            forge test --root contracts/audit-anchor
          else
            echo 'SKIPPED: reviewed vendored Forge/OpenZeppelin toolchain unavailable'
          fi
