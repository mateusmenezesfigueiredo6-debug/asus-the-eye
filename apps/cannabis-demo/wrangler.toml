#
# Site de apresentacao do vertical cannabis, fechado por codigo.
# Secrets (nunca commitados): SITE_ACCESS_CODE, COOKIE_SECRET
#   npx wrangler secret put SITE_ACCESS_CODE
#   npx wrangler secret put COOKIE_SECRET

name = "gotaverde"
main = "worker.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "../../dist-cannabis"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 0.1

# Automacoes: configurar apos o deploy
# npx wrangler kv namespace create OPTOUT  -> colar o id abaixo
# [[kv_namespaces]]
# binding = "OPTOUT"
# id = "COLE_O_ID_AQUI"
