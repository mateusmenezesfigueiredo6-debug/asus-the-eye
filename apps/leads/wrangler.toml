name = "the-eye-leads"
main = "worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Origens que podem POSTar leads via navegador (produção: adicionar o domínio
# próprio dos fronts). Mesmo-origem sempre funciona sem CORS.
[vars]
ALLOWED_ORIGINS = "https://claude.ai"

# Fronts servidos pelo próprio worker: /ledger, /markets, / (índice).
# Sem asset correspondente (ex.: /api/*), a requisição cai no worker.
[assets]
directory = "frontends"


[[d1_databases]]
binding = "DB"
database_name = "the-eye-leads"
database_id = "99089899-4de4-4be3-8b21-f45a68861e82"

[observability]
enabled = true
head_sampling_rate = 0.1
