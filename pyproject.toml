[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = { text = "AGPL-3.0-or-later" }
name = "asus-the-eye"
version = "0.2.0"
description = "Reproducible classical, QUBO and local-QAOA benchmark engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil>=5.9"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
quantum = ["qiskit>=1.3", "qiskit-ibm-runtime>=0.34"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
asus-theye = "asus_theye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["asus_theye*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:asus_theye.*"]

[tool.coverage.run]
source = ["asus_theye"]
branch = true
omit = ["*/dashboard/*"]

[tool.coverage.report]
# 67% hoje. O piso sobe junto com a cobertura, nunca desce sem ADR.
fail_under = 65
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Adotado gradualmente: ver docs/adr/ADR-012-TOOLING.md
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/asus_theye/audit/keccak.py" = ["E701"]
# Body()/Query()/Depends() em default de argumento é o idioma do FastAPI, não um bug.
"apps/*/api.py" = ["B008"]
