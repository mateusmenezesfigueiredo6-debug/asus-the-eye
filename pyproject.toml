[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asus-the-eye"
version = "0.2.0"
description = "Reproducible classical, QUBO and local-QAOA benchmark engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil>=5.9"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
quantum = ["qiskit>=1.3", "qiskit-ibm-runtime>=0.34"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
asus-theye = "asus_theye.cli:main"

[tool.setuptools.packages.find]
include = ["asus_theye*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
