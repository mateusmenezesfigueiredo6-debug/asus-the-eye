# THE EYE — dashboard. Sobe fail-closed: sem THE_EYE_DASHBOARD_TOKEN, recusa.
# Uso:  THE_EYE_DASHBOARD_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/compose.yaml up --build
services:
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: the-eye-dashboard:local
    environment:
      # Obrigatório: sem token o comando serve --expose levanta e o container cai.
      THE_EYE_DASHBOARD_TOKEN: ${THE_EYE_DASHBOARD_TOKEN:?defina um token forte, ex.: openssl rand -hex 32}
      ASUS_MARKETS_DB: ${ASUS_MARKETS_DB:-}
    ports:
      - "127.0.0.1:8712:8712" # publicado só no loopback do host por padrão
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8712/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
